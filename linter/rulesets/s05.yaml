# Rules for §5 URL structure and versioning. Source text: ../../rules.yaml.
#
# Implements guide rules 5.1, 5.3, 5.6, 5.10 (implemented) and 5.4, 5.5
# (partial-proxy). Section 5.9 is an informative CFR reference.
# Strict-only siblings 5.2 and 5.7 live in
# rulesets/s05-strict.yaml. Severity policy and formats follow
# ../README.md#rule-naming-and-severities.
functionsDir: "../functions"
functions:
  - pathSegments
  - valuePattern
rules:
  # 5.1 [M] SHOULD — major version prefix /v{N}/... on GovStack resource paths. The guide 5.10
  # standard unversioned endpoints cannot carry a /v{N}/ prefix and are skipped
  # inside `pathSegments` (functions/lib/standardEndpoints.js), which is the one
  # place that closed set is written down.
  govstack-5.1:
    description: "GovStack resource paths should start with a major version prefix /v{N}/ (guide 5.1, [M])."
    message: "[5.1][M] {{error}}"
    documentationUrl: https://github.com/GovStackWorkingGroup/bb-template/blob/main/api-design-guide/part-b/5-url-structure-and-versioning.md#51-major-version-in-the-path
    severity: warn
    formats: [oas3_1]
    given: $.paths
    then:
      function: pathSegments
      functionOptions: { check: versionPrefix }

  # 5.3 [M] SHOULD — literal path segments use kebab-case. A colon custom
  # method (`/v1/events:search`) is not kebab-case; its finding points the
  # author to the action sub-resource convention of 5.8.
  govstack-5.3:
    description: "Literal path segments should be kebab-case; custom operations use action sub-resources, not colon custom methods (guide 5.3, 5.8, [M])."
    message: "[5.3][M] {{error}}"
    documentationUrl: https://github.com/GovStackWorkingGroup/bb-template/blob/main/api-design-guide/part-b/5-url-structure-and-versioning.md#53-kebab-case-path-segments
    severity: warn
    formats: [oas3_1]
    given: $.paths
    then:
      function: pathSegments
      functionOptions: { check: segmentCasing, casing: kebab }

  # 5.4 [M] SHOULD — path hierarchy shallow: at most two levels of nesting
  # after /v{N}/. "Levels of nesting" counts resource/action segments only:
  # `{param}` path parameters do NOT add levels; an action sub-resource such
  # as `/search` is a level like any other segment. Guide 5.8/15.5 support
  # POST /v1/operations/{operationId}/cancel and 16.11 mandates
  # .../subscriptions/{subscriptionId}/rotate-secret (three raw segments, two
  # non-param levels), so params must be skipped when counting depth.
  # Fixed identifiers are also skipped when evidenced by matching Digital
  # Registries collection metadata. Undeclared
  # fixed IDs still need review. This partial check retains SHOULD-level warn.
  govstack-5.4:
    description: "Path hierarchy should have at most two levels of nesting after /v{N}/ (guide 5.4, [M])."
    message: "[5.4][M] {{error}}"
    documentationUrl: https://github.com/GovStackWorkingGroup/bb-template/blob/main/api-design-guide/part-b/5-url-structure-and-versioning.md#54-shallow-path-nesting
    severity: warn
    formats: [oas3_1]
    given: $.paths
    then:
      function: pathSegments
      functionOptions: { check: maxDepthAfterVersion, max: 2 }

  # 5.5 [M+R] MUST — PROXY (bucket B), notched one step: MUST -> warn.
  # Verifies: GET/DELETE operations do not declare a query parameter whose
  # NAME looks identifier-shaped (exactly "id", camelCase "...Id", or
  # snake_case "..._id").
  # Does NOT verify: the converse (that every identifier which SHOULD be a
  # path parameter actually is one), identifier query params under other
  # HTTP methods, or identifier-shaped names outside this lexical pattern.
  # Pure name-shape heuristic; false positives are possible on legitimate
  # non-identifying filter params that happen to end in "Id".
  govstack-5.5:
    description: "GET/DELETE must not identify a resource via an id-shaped query parameter (guide 5.5, [M+R], proxy)."
    message: "[5.5][M+R] {{error}}"
    documentationUrl: https://github.com/GovStackWorkingGroup/bb-template/blob/main/api-design-guide/part-b/5-url-structure-and-versioning.md#55-identifiers-as-path-parameters
    severity: warn
    formats: [oas3_1]
    given: "$.paths[*][get,delete].parameters[?(@.in=='query')].name"
    then:
      function: valuePattern
      functionOptions:
        name: "query parameter"
        forbidPattern: '(^id$)|([a-z0-9]Id$)|(_id$)'

  # 5.6 [M] SHOULD — query parameter names follow the §9 JSON naming
  # convention (camelCase). Covers both path-item-level (shared) and
  # operation-level query parameters.
  govstack-5.6:
    description: "Query parameter names should be camelCase per §9 (guide 5.6, [M])."
    message: "[5.6][M] {{error}}"
    documentationUrl: https://github.com/GovStackWorkingGroup/bb-template/blob/main/api-design-guide/part-b/5-url-structure-and-versioning.md#56-query-parameter-naming
    severity: warn
    formats: [oas3_1]
    given:
      - "$.paths[*].parameters[?(@.in=='query')].name"
      - "$.paths[*][get,put,post,delete,options,head,patch,trace].parameters[?(@.in=='query')].name"
    then:
      function: valuePattern
      functionOptions:
        name: "query parameter"
        match: '^[a-z][a-zA-Z0-9]*$'

  # 5.10 [M] — the closed set of standard unversioned endpoints. The exemptions
  # the section grants are implemented where they bite (5.1 and 5.3 in
  # `pathSegments`, §12 in `s12-collectionPagination`, 13.1 in
  # `securityCoverage`), all reading the same set from
  # functions/lib/standardEndpoints.js. What is left for a rule of its own is
  # the prohibition: "a BB MUST NOT place a business resource under one of these
  # paths ... they are read-only and MUST NOT declare POST, PUT, PATCH, or
  # DELETE". Whether a GET under one of these paths is a business resource in
  # disguise is not mechanically decidable and stays with review.
  govstack-5.10:
    description: "standard unversioned endpoints are read-only and must not declare a mutating method (guide 5.10, [M])."
    message: "[5.10][M] {{error}}"
    documentationUrl: https://github.com/GovStackWorkingGroup/bb-template/blob/main/api-design-guide/part-b/5-url-structure-and-versioning.md#510-standard-unversioned-endpoints
    severity: error
    formats: [oas3_1]
    given: $.paths
    then:
      function: pathSegments
      functionOptions: { check: standardEndpointsReadOnly }
