# Rules for §4 documentation and descriptions — generated from the guide; see coverage.yaml
#
# Implements guide rules 4.1, 4.2, 4.3, 4.7. Source text: ../../rules.yaml.
# Severity policy and formats follow ../README.md#rule-naming-and-severities.
# 4.4 is STRICT-ONLY and lives in s04-strict.yaml instead.
#
# §4 surface is "Universal": every rule here fires on both OpenAPI and
# AsyncAPI documents. Given targets combine OpenAPI-shaped and AsyncAPI-shaped
# JSONPaths / document branches; whichever doesn't apply to the current
# document format simply selects/finds nothing.
functionsDir: "../functions"
functions:
  - schemaDescriptions
  - s04-bodyExamplesEnums
  - s04-noPlaceholderText
  - s04-operationMetadata
rules:
  # 4.1 [M] — schema descriptions are conditional/advisory. This heuristic warns
  # on every missing description because semantic obviousness is not decidable.
  # mode "all". Scope: components.schemas plus inline request/response body
  # schemas (OpenAPI) and message payload schemas (AsyncAPI). Parameter/header
  # schemas are out of scope (not swept).
  govstack-4.1:
    description: "schemas should have useful descriptions where semantics are not obvious (guide 4.1, [M], proxy)."
    message: "[4.1][M] {{error}}"
    documentationUrl: https://github.com/jeremi/govstack-api-design-guide/blob/main/part-a/4-documentation-requirements.md#41-useful-schema-descriptions
    severity: warn
    formats: [oas3_1, aas3]
    given:
      - $.components.schemas[*]
      - $.paths[*][get,put,post,delete,options,head,patch,trace].requestBody.content[*].schema
      - $.paths[*][get,put,post,delete,options,head,patch,trace].responses[*].content[*].schema
      - $.components.messages[*].payload
    then:
      function: schemaDescriptions
      functionOptions: { mode: all }

  # 4.2 [M+R] — PROXY (bucket B), notched one step: MUST -> warn.
  # Verifies: every request/response body (and AsyncAPI message) declares
  # >=1 example; every `enum` schema node carries a description.
  # Does NOT verify: that an enum's description actually explains what each
  # value means (only that some description is present) - the guide's own
  # text acknowledges an example alone can be insufficient, but a vacuous
  # description would still pass here.
  govstack-4.2:
    description: "request/response bodies need an example; enums need documented values (guide 4.2, [M+R], proxy)."
    message: "[4.2][M+R] {{error}}"
    documentationUrl: https://github.com/jeremi/govstack-api-design-guide/blob/main/part-a/4-documentation-requirements.md#42-examples-for-bodies-and-enums
    severity: warn
    formats: [oas3_1, aas3]
    given: $
    then:
      function: s04-bodyExamplesEnums

  # 4.3 [M+R] — PROXY (bucket B), notched one step: MUST NOT -> warn.
  # Verifies: no string anywhere in the document matches TBD / Lorem ipsum /
  # the literal placeholder list "a, b, c".
  # Does NOT verify: content copy-pasted from another BB with that BB's name
  # still present (needs an external list of BB names), or test plans with
  # literal placeholder steps (needs test-plan-structure context).
  govstack-4.3:
    description: "the spec must not contain placeholder text (guide 4.3, [M+R], proxy)."
    message: "[4.3][M+R] {{error}}"
    documentationUrl: https://github.com/jeremi/govstack-api-design-guide/blob/main/part-a/4-documentation-requirements.md#43-no-placeholder-text
    severity: warn
    formats: [oas3_1, aas3]
    given: $
    then:
      function: s04-noPlaceholderText

  # 4.7 [M+R]: operation metadata extensions, shape when present (MUST).
  # Verifies: on OpenAPI operations (paths and webhooks) and AsyncAPI
  # operations and messages, `x-govstack-use-case` is a non-empty string or a
  # non-empty array of non-empty strings, and `x-govstack-pii` is a boolean.
  # Declaring either extension is a MAY, so absence is never flagged.
  # Does NOT verify: that use-case identifiers name real GovStack use cases or
  # requirements, or that `x-govstack-pii` truthfully reflects the payload.
  govstack-4.7:
    description: "x-govstack-use-case must be a non-empty string or string array and x-govstack-pii a boolean (guide 4.7, [M+R])."
    message: "[4.7][M+R] {{error}}"
    documentationUrl: https://github.com/jeremi/govstack-api-design-guide/blob/main/part-a/4-documentation-requirements.md#47-operation-metadata-extensions
    severity: error
    formats: [oas3_1, aas3]
    given:
      - $.paths[*][get,put,post,delete,options,head,patch,trace]
      - $.webhooks[*][get,put,post,delete,options,head,patch,trace]
      - $.operations[*]
      - $.components.messages[*]
    then:
      function: s04-operationMetadata
      functionOptions: { mode: shape }

  # 4.7 [M+R]: an operation marked `x-govstack-pii: true` MUST NOT be
  # protected by an API key (aligned with 13.6). Verifies: no applicable
  # security requirement (operation `security`, else document `security`)
  # references an `apiKey` scheme. Deterministic given the declared marker,
  # hence error. Does NOT verify: operations carrying personal data that are
  # not marked (13.6's path-heuristic proxy covers those at warn), or
  # credentials applied outside declared security requirements.
  govstack-4.7-pii-apikey:
    description: "operations marked x-govstack-pii: true must not use an apiKey security scheme (guide 4.7, [M+R])."
    message: "[4.7][M+R] {{error}}"
    documentationUrl: https://github.com/jeremi/govstack-api-design-guide/blob/main/part-a/4-documentation-requirements.md#47-operation-metadata-extensions
    severity: error
    formats: [oas3_1]
    given: $
    then:
      function: s04-operationMetadata
      functionOptions: { mode: piiApiKey }
