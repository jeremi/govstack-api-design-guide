openapi: 3.1.0
info:
  title: External selector enums
  version: 1.0.0
  description: External selector enum regression fixture.
paths:
  /v1/policies:
    get:
      operationId: listPolicies
      parameters:
        - name: fields
          in: query
          schema:
            $ref: '#/components/schemas/RequestFields'
        - name: sort
          in: query
          schema:
            $ref: '#/components/schemas/SharedSort'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedSort'
components:
  schemas:
    RequestFields:
      $ref: ./external.schema.json#/$defs/RequestFields
    SharedSort:
      $ref: ./external.schema.json#/$defs/SharedSort
