asyncapi: 3.0.0
info:
  title: Externally defined registry event
  version: 1.0.0
channels:
  records:
    address: records/events
    messages:
      created:
        $ref: '#/components/messages/RecordCreated'
operations:
  publish:
    action: send
    channel:
      $ref: '#/channels/records'
    messages:
      - $ref: '#/channels/records/messages/created'
components:
  messages:
    RecordCreated:
      contentType: application/cloudevents+json
      payload:
        $ref: './event.schema.yaml'
