openapi: 3.1.0
info:
  title: Sample API
  version: 1.0.0
  description: A sample API with a plural resource collection name.
  contact:
    name: Sample BB Team
    url: https://example.org/contact
paths:
  /v1/policies:
    get:
      operationId: listPolicies
      summary: List policies
      description: Returns a page of policies.
      tags: [Policies]
      responses:
        "200":
          description: A page of policies.
  # Guide 5.10 standard unversioned endpoints keep the spelling their own
  # definition gives them.
  /.well-known/api-catalog:
    get:
      operationId: getApiCatalog
      summary: Get the API catalog
      description: Returns the RFC 9727 API catalog.
      tags: [Discovery]
      responses:
        "200":
          description: The API catalog.
