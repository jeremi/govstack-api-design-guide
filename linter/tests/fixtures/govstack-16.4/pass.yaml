openapi: 3.1.0
info:
  title: Social Protection Events API
  version: 1.0.0
  description: CloudEvents source is a stable authority, tenant and environment identifier.
  contact:
    name: Sample BB Team
    url: https://example.org/contact
webhooks:
  paymentCompleted:
    post:
      summary: Payment completed event
      requestBody:
        content:
          application/cloudevents+json:
            schema:
              type: object
              required: [specversion, id, source, type, data]
              properties:
                specversion:
                  const: "1.0"
                id:
                  type: string
                source:
                  type: string
                  examples:
                    - "urn:govstack:country:ke:agency:social-protection:tenant:42:environment:prod"
                    - "https://203.0.113.42:8443/ke/social-protection/tenant/42/prod"
                type:
                  type: string
                  const: "global.govstack.payments.payment.completed"
                data:
                  type: object
      responses:
        '200':
          description: Acknowledged
