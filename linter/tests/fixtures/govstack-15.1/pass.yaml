# 15.1 pass: the 202 Accepted response declares Location and a concrete body.
openapi: 3.1.0
info:
  title: Registry API
  version: 1.0.0
paths:
  /v1/jobs:
    post:
      responses:
        '202':
          description: accepted
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
