openapi: 3.1.0
info:
  title: Sample API
  version: 1.0.0
  description: A sample API with a versioned path.
  contact:
    name: Sample BB Team
    url: https://example.org/contact
paths:
  /v1/events:
    get:
      operationId: listEvents
      summary: List events
      description: Returns a page of events.
      tags: [Events]
      responses:
        "200":
          description: A page of events.
  # Guide 5.10 exempts an optional unversioned /health endpoint from 5.1.
  /health:
    get:
      operationId: getHealth
      summary: Liveness check
      description: Optional operational endpoint, exempt under guide 5.10.
      tags: [Health]
      security: []
      responses:
        "200":
          description: OK
