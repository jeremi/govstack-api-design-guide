openapi: 3.1.0
info:
  title: Section 9.7 fail
  version: 1.0.0
paths: {}
components:
  schemas:
    Status:
      type: string
      enum:
        - active
        - pendingReview
    # The selector carve-out covers the selectable names themselves, not
    # state enums nested in an object that happens to be named `fields`.
    Filter:
      type: object
      properties:
        fields:
          type: object
          properties:
            state:
              type: string
              enum: [active]
