openapi: 3.1.0
info:
  title: Section 9.7 pass
  version: 1.0.0
paths:
  /v1/policies:
    get:
      operationId: listPolicies
      parameters:
        - $ref: '#/components/parameters/PolicyFields'
        - name: sort
          in: query
          schema:
            $ref: '#/components/schemas/PolicySort'
      responses:
        '200':
          description: OK
    post:
      operationId: searchPolicies
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicySearchRequest'
      responses:
        '200':
          description: OK
components:
  parameters:
    PolicyFields:
      name: fields
      in: query
      style: form
      explode: false
      schema:
        $ref: '#/components/schemas/PolicyFields'
  schemas:
    Status:
      type: string
      enum:
        - ACTIVE
        - PENDING_REVIEW
    # §9.7 carve-outs: values whose form is fixed by another rule or an
    # external standard keep their own casing and must not be flagged.
    SigningAlgorithm:
      type: string
      enum: [ES256, EdDSA]
    SigningCurve:
      type: string
      enum: [Ed25519, P-256]
    MediaType:
      type: string
      enum: [application/json, application/problem+json]
    ErrorCode:
      type: string
      enum: [global.govstack.identity.personNotFound]
    EventType:
      type: string
      enum: [global.govstack.registration.record.created]
    LanguageTag:
      type: string
      enum: [en, en-US, zh-Hans-CN]
    CurrencyCode:
      type: string
      enum: [USD, EUR]
    # §12.10 field-selection names and §12.7 sort keys are property names,
    # whether referenced by the query parameter or carried in a search body.
    PolicyFields:
      type: array
      items:
        type: string
        enum: [policyName, effectiveDate]
    PolicySort:
      type: string
      enum: [effectiveDate, -effectiveDate]
    PolicySearchRequest:
      type: object
      properties:
        fields:
          type: array
          items:
            type: string
            enum: [policyName, effectiveDate]
        sort:
          type: string
          enum: [policyName, -policyName]
