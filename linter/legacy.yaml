#
# Intended use: an API surface published before its BB pinned this guide. The
# surface declares `profile: legacy` in info.x-govstack-api-guide (guide 20.3)
# and stays on its current major version (guide 1.10). Run it with
#
#   node cli.mjs --profile legacy
#   npx spectral lint -r legacy.yaml path/to/openapi.yaml
#
# Classification principle: a rule is "wire-contract" when its remedy would
# change the public wire contract (paths, methods, status codes, headers,
# payload shapes, names, security, events). Fixing those on a published major
# version would break existing clients, so this profile REPORTS them at info
# instead of failing. "Documentation" rules can be fixed without touching the
# wire and keep their normal ruleset.yaml severity.
#
#   documentation: sections 2 (except 2.6-version), 3, 4, 20 and rules 7.13,
#                  7.14, 7.21, 13.1, 18.1
#   wire exception: 2.6-version (duplicated version segments in server URLs)
#   wire-contract: sections 5, 6, 7, 8, 9, 10, 11, 12, 13 (13.2 onward), 14,
#                  15, 16, 17, 18 (except 18.1), 19
#
