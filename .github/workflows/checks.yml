# Checks for the GovStack Cross-BB API Design Guide: generated indexes, links,
# the linter's test suite, and validation of the golden reference specs.
name: Checks

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  guide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Check generated rule index
        run: python3 tools/build_rules_index.py --check
      - name: Check guide links
        run: python3 tools/check_links.py
      - name: Run tools unit tests
        run: |
          python3 tools/test_anchors.py
          python3 tools/test_build_rules_index.py

  linter-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Test linter and coverage contract
        working-directory: linter
        env:
          COVERAGE_ENFORCE: "1"
        run: |
          npm ci
          npm test
      - name: Check generated verification blocks
        run: node linter/scripts/generate-verification.mjs --check
      - name: Validate the AsyncAPI golden and its external references
        run: npx --yes @asyncapi/cli@6.0.2 validate linter/tests/golden/asyncapi-golden.yaml
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Validate the OpenAPI golden and its external references
        run: |
          python -m pip install openapi-spec-validator==0.9.0
          openapi-spec-validator linter/tests/golden/openapi-golden.yaml
